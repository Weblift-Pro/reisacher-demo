<!doctype html>
<html lang="de">
<head>

<style>
:root{--bg:#2d2f38;--card:#363944;--ink:#f2f0eb;--mut:#a8abb4;--line:#494c58;--moss:#c9a46a;--mi:#1b1c21;--soft:#3e414c;--warn:#f0907a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Montserrat",system-ui,sans-serif}
.top{background:#17181c;color:#fff;display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;justify-content:space-between;padding:1.05rem 1.3rem}
.brand{display:flex;gap:.75rem;align-items:baseline;color:#fff;white-space:nowrap}
.brand span{font-weight:400;letter-spacing:.55em;font-size:1rem}
.brand b{font-weight:900;letter-spacing:.05em;font-size:1.2rem}
.tabs{display:flex;gap:1.2rem}
.tabs a{padding:.3rem 0;color:#cfcfcf;text-decoration:none;font-size:.9rem;border-bottom:2px solid transparent}
.tabs a.on{color:#fff;border-bottom-color:var(--moss)}
main{max-width:760px;margin:0 auto;padding:0 1.1rem 3rem}
main.wide{max-width:1100px;padding-top:1.2rem}
h1{font-size:1.65rem;margin:0 0 .3rem;font-weight:600}
h2{font-size:1.02rem;margin:1.7rem 0 .6rem;font-weight:600}
h2 i{font-style:normal;color:var(--moss);font-weight:900}h2 i::after{content:'.'}
h3.grp{font-size:.78rem;letter-spacing:.25em;text-transform:uppercase;color:var(--moss);margin:1.1rem 0 .45rem;font-weight:700}
.sub{color:var(--mut);margin:0}
.grid{display:grid;gap:.5rem;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.row{display:flex;flex-wrap:wrap;gap:.45rem}
.opt,.chip{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:3px;padding:.7rem .9rem;text-align:left;cursor:pointer}
.chip{padding:.45rem .9rem}
.opt small{display:block;color:var(--mut)}
.opt.on,.chip.on{background:var(--moss);border-color:var(--moss);color:var(--mi)}
.opt.on small{color:var(--mi);opacity:.85}
:focus-visible{outline:2px solid var(--moss);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:1rem}
label{display:block;font-size:.88rem;font-weight:600;margin:.8rem 0 .25rem}
input:not([type=checkbox]),textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:2px;padding:.6rem .8rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}

.btn:not(.ghost):hover{background:var(--moss);color:var(--mi)}
.btn.ghost{border-color:var(--line);color:var(--ink);margin:0;padding:.4rem .9rem;text-transform:none;letter-spacing:0;font-weight:500;font-size:.85rem}
.btn:disabled{opacity:.4;cursor:default}
.err{color:var(--warn);font-size:.9rem;margin:.6rem 0 0}
.hint{color:var(--mut);font-size:.9rem}
.stats{display:flex;gap:.6rem;flex-wrap:wrap;margin:1rem 0}
.stats .card{flex:1;min-width:140px}
.stats b{font-size:1.5rem;display:block;color:var(--moss)}
.nav{display:flex;gap:.5rem;align-items:center;margin:1rem 0 .6rem;flex-wrap:wrap}
.cal{overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--card)}
.cg{display:grid;grid-template-columns:44px repeat(5,minmax(128px,1fr));min-width:720px}
.hd{padding:.5rem;font-size:.8rem;font-weight:600;border-left:1px solid var(--line);border-bottom:1px solid var(--line)}
.hd small{display:block;color:var(--mut);font-weight:400}
.hr{height:60px;font-size:.7rem;color:var(--mut);padding:.1rem .3rem}
.col{position:relative;cursor:cell;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px 60px)}
.ap{position:absolute;left:3px;right:3px;background:var(--soft);border-left:4px solid var(--moss);border-radius:3px;padding:.2rem .45rem;font-size:.75rem;line-height:1.3;overflow:hidden;cursor:pointer}
.ap.new{background:var(--moss);color:var(--mi)}
.li{display:flex;gap:.8rem;justify-content:space-between;align-items:flex-start;padding:.75rem 0;border-bottom:1px solid var(--line)}

.lk{cursor:pointer}.lk:hover{background:var(--soft)}
.badge{background:var(--moss);color:var(--mi);border-radius:99px;font-size:.7rem;padding:.1rem .5rem;margin-left:.4rem;font-weight:600}
.kv{display:flex;justify-content:space-between;gap:1rem;padding:.6rem 0;border-bottom:1px solid var(--line)}.kv:last-child{border:0}.kv span{color:var(--mut)}.kv b{text-align:right;font-weight:600}.kv a{color:var(--moss)}
.duo{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:1.5rem;align-items:start}
.phone{border:10px solid #0d0d10;border-radius:38px;background:var(--bg);overflow:hidden;position:sticky;top:.5rem;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.notch{height:22px;background:#0d0d10;width:120px;margin:0 auto;border-radius:0 0 14px 14px}
.scr{max-height:78vh;overflow-y:auto;overscroll-behavior:contain;padding:0 1rem 1.5rem}
.desk{min-width:0}

.acc{width:100%;display:flex;justify-content:space-between;align-items:center;font:inherit;font-weight:300;font-size:1.3rem;letter-spacing:.04em;color:var(--ink);background:var(--card);border:1px solid var(--moss);border-radius:2px;padding:1rem 1.1rem;cursor:pointer;margin-bottom:.8rem}
.acc b{color:var(--moss);font-size:1.6rem;line-height:1;font-weight:400}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:1rem;z-index:50;overflow-y:auto}
.mod{width:100%;max-width:480px;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.ap .rz{position:absolute;right:0;bottom:0;width:44px;height:16px;cursor:ns-resize;touch-action:none;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 5px 3px 0}
.ap .rz::after{content:"";width:16px;height:6px;border-bottom:2px solid currentColor;border-top:2px solid currentColor;opacity:.45}
.ap:hover .rz::after,.ap.drag .rz::after{opacity:.9}
.ap.drag{outline:2px solid var(--moss);z-index:5;overflow:visible}
.ap .rzt{position:absolute;right:4px;bottom:16px;background:#111;color:#fff;font-size:.72rem;padding:.05rem .35rem;border-radius:3px;white-space:nowrap}
#toast{position:fixed;left:50%;bottom:1.5rem;transform:translate(-50%,180%);background:#111;color:#fff;border-left:4px solid var(--moss);padding:.75rem 1.1rem;border-radius:3px;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:60;transition:transform .25s;max-width:92vw;font-size:.95rem}
#toast.on{transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}

/* Webseite im Reisacher-Look */
.tg{display:grid;grid-template-columns:1fr 1fr;margin:0 -1.1rem}
.tl{min-height:220px;display:flex;align-items:center;padding:1.4rem 1.6rem;font-weight:300;font-size:clamp(1.35rem,4.6vw,2.5rem);line-height:1.05;text-transform:uppercase;color:#fff}
.ph{background-size:cover;background-position:center;min-height:220px}
.band{height:240px;background-size:cover;background-position:center;margin:0 -1.1rem}
.stripes{width:190px;height:24px;margin:0 auto 1.2rem;background:repeating-linear-gradient(105deg,rgba(255,255,255,.85) 0 2px,transparent 2px 10px)}
.blk{text-align:center;padding:2.6rem .4rem}
.lead{font-size:1.12rem;font-weight:600;max-width:34em;margin:0 auto}
.ic{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;text-align:center;padding:2.4rem 0}
.ic svg{width:64px;height:64px;color:#fff;margin-bottom:.6rem}
.ic b{display:block;font-size:1.1rem;font-weight:600;margin-bottom:.4rem}
.ic p{color:var(--mut);font-size:.92rem;margin:0}
.bul{list-style:none;padding:0;margin:.8rem 0 0;font-size:1.05rem}
.bul li::before{content:"• "}
.claim{font-size:1.45rem;font-weight:600;margin:0 0 1rem}
.dark{background:#17181c;color:#fff;padding:1.7rem 1.4rem;line-height:1.7;margin:2.5rem -1.1rem 0}
.dark b{display:block;margin-top:1rem;letter-spacing:.2em;font-size:.78rem;color:var(--moss)}
.dark b:first-child{margin-top:0}
.phone .tl{font-size:1.15rem;min-height:140px;padding:1rem}.phone .ph{min-height:140px}.phone .band{height:150px}.phone .ic{grid-template-columns:1fr}.phone .brand span{letter-spacing:.3em}
@media(max-width:560px){.ic{grid-template-columns:1fr}.tl,.ph{min-height:160px}.tl{padding:1rem 1.1rem}}
</style>
</head>

 if(!MAIL_KEY)return;
 const L=LS.find(x=>x.id===ap.ls),M=MA.find(x=>x.id===ap.ma);

 .then(r=>r.json()).then(j=>{ap.mst=j.success?'ok':'err';if(cb)cb(ap.mst==='ok');render()}).catch(()=>{ap.mst='err';if(cb)cb(false);render()});

const PUF=10,HRS={2:[8,18],3:[8,18],4:[8,18],5:[8,18],6:[8,13]},WT=['So','Mo','Di','Mi','Do','Fr','Sa'];
const pad=n=>String(n).padStart(2,'0'),hm=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const lab=s=>{const d=parse(s);return WT[d.getDay()]+', '+d.getDate()+'.'+(d.getMonth()+1)+'.'};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const open=[];for(let i=1;open.length<14;i++){const d=new Date();d.setDate(d.getDate()+i);if(HRS[d.getDay()])open.push(iso(d))}
const A=[];let nid=1;
let sd=20261107;const rnd=()=>(sd=(sd*1664525+1013904223)%4294967296)/4294967296;
const FN=['Anna','Markus','Julia','Sabrina','Lena','Nina','Jonas','Eva','Claudia','Peter','Thomas','Petra','Michael','Sandra','Stefan','Katrin','Andreas','Monika','Daniel','Ramona','Frank','Birgit','Jürgen','Heike','Tobias','Simone','Uwe','Nadine','Klaus','Tanja'];
const LN=['Keller','Weber','Schmid','Maurer','Vogt','Hartmann','Braun','Lang','Frei','Dietz','Roth','Fischer','Wagner','Becker','Hofmann','Schäfer','Koch','Bauer','Richter','Klein','Wolf','Schröder','Neumann','Schwarz','Zimmermann','Krüger','Hahn','Beck','Maier','Brenner'];
const NOTES=['Spitzen schneiden, Länge bleibt','Ansatz dunkelblond','Locken eher weich','Bitte ohne Föhnen','Richtung Kupfer','Kurz an den Seiten','Empfindliche Kopfhaut','Bringt Foto als Vorlage mit'];
const slug=t=>t.toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss');
const CU=Array.from({length:90},(_,i)=>{const f=FN[i%30],l=LN[(i*11+3+Math.floor(i/30)*7)%30];
 return{n:f+' '+l,tel:i%2?'07351 '+(10000+(i*7919)%89999):'01'+['51','52','60','70','75','76'][i%6]+' '+(1000000+(i*104729)%8999999),mail:slug(f)+'.'+slug(l)+'@'+['gmail.com','web.de','gmx.de','t-online.de','outlook.de'][i%5],prior:2+(i*5)%12}});
let cc=0;
const DAYPOOL=[1,1,2,3,3,4,5,6,7,8,9,11,13,13,14,14,15,16,17,18,19];
open.forEach(ds=>{const H=HRS[parse(ds).getDay()],sat=H[1]<18;
 MA.forEach(m=>{const n=sat?5:5+(rnd()<.45?1:0);let t=H[0]*60+(sat||rnd()<.5?0:15);
  for(let k=0;k<n;k++){
   const rem=H[1]*60-t-(n-k-1)*(sat?50:75);
   const pool=(sat?[1,2,11,13,14,15,16]:DAYPOOL).filter(id=>LS.find(x=>x.id===id).d+PUF<=rem);
   if(!pool.length)break;
   const ls=pool[Math.floor(rnd()*pool.length)],L=LS.find(x=>x.id===ls),c=CU[(cc*37)%90];
   A.push({id:nid++,ma:m.id,ls,date:ds,s:t,e:t+L.d+PUF,name:c.n,tel:c.tel,mail:c.mail,note:cc%4===0?NOTES[cc%NOTES.length]:'',st:'gebucht'});cc++;
   t+=L.d+PUF+(sat?0:(rnd()<.35?15:0)+(rnd()<.2?15:0));}})});
const slots=(ma,ds,blk)=>{const H=HRS[parse(ds).getDay()],r=[];if(!H)return r;for(let t=H[0]*60;t+blk<=H[1]*60;t+=15)if(!A.some(a=>a.ma===ma&&a.date===ds&&a.st!=='storniert'&&a.s<t+blk&&t<a.e))r.push(t);return r};
const slotsAny=(ds,blk)=>[...new Set(MA.flatMap(m=>slots(m.id,ds,blk)))].sort((a,b)=>a-b);

function viewK(compact){
 if(S.done){const a=S.done,L=LS.find(x=>x.id===a.ls),M=MA.find(x=>x.id===a.ma);
  return `<div style="padding-top:1.4rem"><h1>Termin gebucht</h1><div class="card" style="margin-top:1rem"><b>${esc(lname(L))}</b><br>${lab(a.date)} um ${hm(a.s)} Uhr bei ${esc(M.t)}<p class="hint">Eine Bestätigung geht an ${esc(a.mail)}. Einen Tag vorher erinnern wir Sie per E-Mail.</p>${a.mst==='send'?'<p class="hint">E-Mail wird verschickt …</p>':a.mst==='ok'?'<p class="hint" style="color:var(--moss);font-weight:700">✓ Bestätigung per E-Mail verschickt</p>':a.mst==='err'?'<p class="hint">(E-Mail konnte nicht verschickt werden)</p>':''}</div><div class="card" style="margin-top:.8rem"><span class="hint">E-Mail an ${esc(a.mail)}</span><br><b>Ihr Termin bei Friseur Reisacher am ${lab(a.date)}</b><p style="margin:.4rem 0 0">Guten Tag ${esc(a.name)}, wir freuen uns auf Sie: ${esc(lname(L))} um ${hm(a.s)} Uhr bei ${esc(M.t)}. Schwanenstr. 3, Biberach. Bis bald, Ihr Team Friseur Reisacher.</p></div><button class="btn" data-a="again">Weiteren Termin buchen</button></div>`}
 const L=LS.find(x=>x.id===S.ls),blk=L?L.d+PUF:0;
 let h=(compact?'':SITE_TOP)+`<section id="termin" style="margin-top:${compact?'1.4rem':'2.4rem'}">${compact?'<p class="claim" style="font-size:1.25rem;margin-bottom:.4rem">Termin online buchen</p>':`<button class="acc" data-a="tog" aria-expanded="${OPEN}"><span>TERMIN ONLINE BUCHEN</span><b>${OPEN?'−':'+'}</b></button>`}<p class="sub">Wählen Sie Leistung, Mitarbeiter und Wunschtermin. Sie erhalten sofort eine Bestätigung.</p>`;
 if(!compact&&!OPEN)return h+'</section>'+mapSec()+SITE_BOT;
 h+=`<h2><i>1</i>Welche Leistung möchten Sie buchen?</h2>${CATS.map(c=>`<h3 class="grp">${c}</h3><div class="grid">${LS.filter(x=>x.c===c).map(x=>`<button class="opt${S.ls===x.id?' on':''}" data-a="ls" data-v="${x.id}">${esc(x.n)}<small>ca. ${x.d} Min. · ${esc(x.p)}</small></button>`).join('')}</div>`).join('')}<p class="hint" style="margin:.6rem 0 0">Preise für Damen ab Kurzhaar, Langhaar etwas mehr.</p>`;
 if(L){h+=`<h2><i>2</i>Bei wem möchten Sie den Termin?</h2><div class="row"><button class="chip${S.ma===0?' on':''}" data-a="ma" data-v="0">Beliebig</button>${MA.map(m=>`<button class="chip${S.ma===m.id?' on':''}" data-a="ma" data-v="${m.id}">${esc(m.t)}</button>`).join('')}</div>`;

  if(S.date){const sl=S.ma?slots(S.ma,S.date,blk):slotsAny(S.date,blk);
   h+=`<div class="row" style="margin-top:.8rem">${sl.length?sl.map(t=>`<button class="chip${S.t===t?' on':''}" data-a="t" data-v="${t}">${hm(t)}</button>`).join(''):'<span class="hint">An diesem Tag ist nichts mehr frei. Bitte einen anderen Tag wählen.</span>'}</div>`}

 const H=HRS[parse(C.date).getDay()],all=A.filter(a=>a.st!=='storniert'),day=all.filter(a=>a.date===C.date).sort((a,b)=>a.s-b.s||a.ma-b.ma);
 const h0=H[0],hrs=Math.ceil(H[1]-H[0]),i=open.indexOf(C.date);
 let h=`<h1>${gruss()}, Herr Reisacher</h1><p class="sub">Heute ist ${heute()}. Hier sehen Sie alle Termine Ihres Teams, neue Online-Buchungen erscheinen sofort.</p><div class="stats"><div class="card"><b>${day.length}</b>Termine am gewählten Tag</div><div class="card"><b>${all.length}</b>Gebuchte Termine insgesamt</div><div class="card"><b>${all.filter(a=>a.neu).length}</b>Neu online gebucht</div></div>`;
 h+=`<div class="nav"><button class="btn ghost" data-a="cd" data-v="-1" ${i<1?'disabled':''}>Vorheriger Tag</button><b>${lab(C.date)}</b><button class="btn ghost" data-a="cd" data-v="1" ${i>=open.length-1?'disabled':''}>Nächster Tag</button><button class="btn ghost" data-a="addt" style="margin-left:auto">+ Termin eintragen</button></div><p class="hint" style="margin:0 0 .6rem">Tippen Sie auf eine freie Stelle im Kalender, um einen Termin einzutragen. Am unteren Rand eines Termins ziehen Sie ihn länger oder kürzer.</p>`;
 h+=`<div class="cal"><div class="cg"><div class="hd"></div>${MA.map(m=>`<div class="hd">${esc(m.n)}<small>${esc(m.r)}</small></div>`).join('')}<div>${Array.from({length:hrs},(_,k)=>`<div class="hr">${pad(h0+k)}:00</div>`).join('')}</div>${MA.map(m=>`<div class="col" data-a="slot" data-v="${m.id}" style="height:${hrs*60}px">${day.filter(a=>a.ma===m.id).map(a=>{const L=LS.find(x=>x.id===a.ls);return `<div class="ap${a.neu||a.man?' new':''}" role="button" tabindex="0" data-a="det" data-v="${a.id}" style="top:${a.s-h0*60}px;height:${a.e-a.s-PUF}px"><b>${hm(a.s)} ${esc(a.name)}</b><br>${esc(lname(L))}<span class="rz" data-a="rz" aria-hidden="true"></span></div>`}).join('')}</div>`).join('')}</div></div>`;
 h+=`<h2 style="margin-top:2rem">Termine am ${lab(C.date)}</h2><p class="hint" style="margin:0 0 .6rem">Tippen Sie auf einen Termin für Kontaktdaten und Kundenhistorie.</p><div class="card">${day.map(a=>{const L=LS.find(x=>x.id===a.ls),M=MA.find(x=>x.id===a.ma);return `<div class="li lk" role="button" tabindex="0" data-a="det" data-v="${a.id}"><div><b>${hm(a.s)} ${esc(a.name)}</b>${a.neu?'<span class="badge">Neu</span>':''}${a.man?'<span class="badge">Telefon</span>':''}<br>${esc(lname(L))} bei ${esc(M.t)}${a.note?`<br><span class="hint">Wunsch: ${esc(a.note)}</span>`:''}</div><b style="color:var(--moss);font-size:1.5rem">›</b></div>`}).join('')||'<span class="hint">Keine Termine.</span>'}</div>`;
 return h}

function viewD(id){
 const a=A.find(x=>x.id===id);if(!a){DET=null;return viewC()}
 const L=LS.find(x=>x.id===a.ls),M=MA.find(x=>x.id===a.ma),c=CU.find(x=>x.n===a.name),hist=A.filter(x=>x.name===a.name&&x.st!=='storniert').sort((p,q)=>p.date.localeCompare(q.date)||p.s-q.s);
 return `<button class="btn ghost" data-a="back">‹ Zurück zur Chef-Ansicht</button><h1 style="margin-top:1rem">${esc(a.name)}${a.neu?'<span class="badge">Neu</span>':''}</h1><p class="sub">${lab(a.date)} von ${hm(a.s)} bis ${hm(a.e-PUF)} Uhr${a.st==='storniert'?' (storniert)':''}</p>
<div class="card" style="margin-top:1rem"><div class="kv"><span>Leistung</span><b>${esc(lname(L))} / ${esc(L.p)}</b></div><div class="kv"><span>Mitarbeiter</span><b>${esc(M.n)}</b></div><div class="kv"><span>Dauer</span><b>${a.e-a.s-PUF} Min.</b></div><div class="kv"><span>Sonderwunsch</span><b>${esc(a.note)||'–'}</b></div></div>
<h2>Kontakt</h2><div class="card"><div class="kv"><span>Telefon</span><b>${a.tel?`<a href="tel:${esc(a.tel.replace(/\s/g,''))}">${esc(a.tel)}</a>`:'–'}</b></div><div class="kv"><span>E-Mail</span><b>${a.mail?`<a href="mailto:${esc(a.mail)}">${esc(a.mail)}</a>`:'–'}</b></div></div>
<h2>Kundenhistorie</h2><div class="card"><p class="hint" style="margin-top:0">${(c?c.prior:0)+hist.length} Besuche insgesamt, ${hist.length} davon im Kalender</p>${hist.map(x=>`<div class="li"><div>${lab(x.date)} um ${hm(x.s)} Uhr${x.id===a.id?'<span class="badge">Dieser Termin</span>':''}<br><span class="hint">${esc(lname(LS.find(q=>q.id===x.ls)))} bei ${esc(MA.find(q=>q.id===x.ma).t)}</span></div></div>`).join('')}</div>
${a.st!=='storniert'?`<button class="btn" data-a="cancel" data-v="${a.id}">Termin stornieren</button>`:''}`}

function viewNew(){const N=NEWT,H=HRS[parse(N.date).getDay()],ts=[];for(let t=H[0]*60;t<H[1]*60;t+=15)ts.push(t);
return `<div class="ovl" data-a="ncancel"><div class="mod card" data-a="modal" role="dialog" aria-modal="true" aria-labelledby="nt"><h2 id="nt" style="margin-top:0">Termin eintragen</h2><p class="sub">${lab(N.date)}, zum Beispiel für eine Kundin am Telefon</p>
<div class="two"><div><label for="x_ma">Mitarbeiter</label><select id="x_ma">${MA.map(m=>`<option value="${m.id}"${m.id===N.ma?' selected':''}>${esc(m.n)}</option>`).join('')}</select></div><div><label for="x_s">Uhrzeit</label><select id="x_s">${ts.map(t=>`<option value="${t}"${t===N.s?' selected':''}>${hm(t)} Uhr</option>`).join('')}</select></div></div>
<label for="x_ls">Leistung</label><select id="x_ls">${CATS.map(c=>`<optgroup label="${c}">${LS.filter(l=>l.c===c).map(l=>`<option value="${l.id}"${l.id===N.ls?' selected':''}>${esc(l.n)} (${l.d} Min.)</option>`).join('')}</optgroup>`).join('')}</select>
<label for="x_name">Name</label><input id="x_name" value="${esc(N.name||'')}" autocomplete="off" placeholder="Vor- und Nachname">
<div class="two"><div><label for="x_tel">Telefon</label><input id="x_tel" type="tel" value="${esc(N.tel||'')}" autocomplete="off"></div><div><label for="x_mail">E-Mail (optional)</label><input id="x_mail" type="email" value="${esc(N.mail||'')}" autocomplete="off"></div></div>
<p class="hint" style="margin:.3rem 0 0">Mit E-Mail-Adresse bekommt die Kundin automatisch eine Bestätigung.</p>
<label for="x_note">Notiz (optional)</label><input id="x_note" value="${esc(N.note||'')}" autocomplete="off" placeholder="z. B. Farbe wie letztes Mal">
${N.err?`<p class="err" role="alert">${esc(N.err)}</p>`:''}
<div style="display:flex;gap:.6rem;flex-wrap:wrap;align-items:center"><button class="btn" data-a="nsave">Termin eintragen</button><button class="btn ghost" data-a="ncancel" style="margin-top:1rem">Abbrechen</button></div></div></div>`}
function saveNew(){const g=id=>{const el=document.getElementById(id);return el?el.value:''},N=NEWT;
 N.ma=+g('x_ma');N.s=+g('x_s');N.ls=+g('x_ls');N.name=g('x_name').trim();N.tel=g('x_tel').trim();N.mail=g('x_mail').trim();N.note=g('x_note').trim();N.err='';
 const L=LS.find(x=>x.id===N.ls),blk=L.d+PUF,M=MA.find(m=>m.id===N.ma),H=HRS[parse(N.date).getDay()];
 if(!N.name){N.err='Bitte den Namen der Kundin oder des Kunden eintragen.';return}
 if(N.mail&&!/\S+@\S+\.\S+/.test(N.mail)){N.err='Die E-Mail-Adresse sieht nicht vollständig aus.';return}
 if(N.s+L.d>H[1]*60){N.err='Der Termin würde nach Ladenschluss enden. Bitte eine frühere Uhrzeit wählen.';return}
 if(A.some(a=>a.ma===N.ma&&a.date===N.date&&a.st!=='storniert'&&a.s<N.s+blk&&N.s<a.e)){N.err=M.t+' hat um '+hm(N.s)+' Uhr schon einen Termin. Bitte eine andere Uhrzeit wählen.';return}
 const ap={id:nid++,ma:N.ma,ls:N.ls,date:N.date,s:N.s,e:N.s+blk,name:N.name,tel:N.tel,mail:N.mail,note:N.note,st:'gebucht',man:true};A.push(ap);NEWT=null;
 if(ap.mail&&MAIL_KEY){toast('Termin eingetragen, Bestätigung wird verschickt …');sendMail(ap,ok=>toast(ok?'✓ Bestätigung an '+ap.mail+' verschickt':'Termin eingetragen, die E-Mail konnte nicht verschickt werden'))}
 else toast('✓ Termin eingetragen: '+hm(ap.s)+' Uhr bei '+M.t)}

function viewPin(){return `<div class="card" style="max-width:360px;margin:2rem auto"><h1 style="font-size:1.4rem">Chef-Login</h1><p class="sub">Bitte geben Sie den Zugangscode ein.</p><label for="pin">Zugangscode</label><input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8">${PINERR?'<p class="err" role="alert">Der Code ist nicht korrekt. Bitte versuchen Sie es erneut.</p>':''}<button class="btn" data-a="pin">Entsperren</button></div>`}

let VIEW='#kunde';try{VIEW=location.hash||'#kunde'}catch(e){}
document.addEventListener('click',e=>{const l=e.target.closest('.tabs a');if(!l)return;e.preventDefault();VIEW=l.getAttribute('href');DET=null;NEWT=null;try{history.replaceState(null,'',VIEW)}catch(_){}if(l.dataset.a!=='lock'){render();scrollTo(0,0)}},true);
function render(){const h=VIEW,c=h==='#chef',d=h==='#demo',y=scrollY,sc=$('.scr'),st=sc?sc.scrollTop:0;$('#tk').className=c||d?'':'on';$('#tc').className=c?'on':'';$('#td').className=d?'on':'';$('#app').className=c||d?'wide':'';$('#tc').textContent=UNL?'Chef-Ansicht':'Chef-Login';$('#td').hidden=!UNL;$('#tl').hidden=!UNL;$('#app').innerHTML=(c||d)&&!UNL?viewPin():d?`<div class="duo"><div class="phone"><div class="notch"></div><div class="scr">${viewK(1)}</div></div><div class="desk">${DET?viewD(DET):viewC()}</div></div>`:c?(DET?viewD(DET):viewC()):viewK();if(NEWT&&UNL&&(c||d)){$('#app').insertAdjacentHTML('beforeend',viewNew());if(NFOC){const f=$('#x_name');if(f)f.focus({preventScroll:true});NFOC=false}}const n=$('.scr');if(n)n.scrollTop=st;const pf=$('#pin');if(pf)pf.focus();scrollTo(0,TOP?0:y);TOP=false}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
 if(a==='modal'||a==='rz'||a==='lock'&&false)return;
 if(Date.now()-SUP<500&&(a==='det'||a==='slot'))return;
 if(a==='go'||a==='tog'){OPEN=a==='go'?true:!OPEN;render();$('#termin').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});return}
 else if(a==='ls'){S.ls=+v;S.t=null;S.err=''}
 else if(a==='ma'){S.ma=+v;S.t=null}
 else if(a==='d'){S.date=v;S.t=null}
 else if(a==='t'){S.t=+v;S.err=''}
 else if(a==='again'){S={ls:null,ma:0,date:null,t:null,f:{},err:'',done:null}}
 else if(a==='pin'){if($('#pin').value==='1234'){UNL=true;PINERR=false}else PINERR=true}
 else if(a==='lock'){UNL=false;DET=null}
 else if(a==='det'){DET=+v;TOP=true}
 else if(a==='back'){DET=null;TOP=true}
 else if(a==='cd'){C.date=open[open.indexOf(C.date)+ +v]}
 else if(a==='cancel'){A.find(x=>x.id===+v).st='storniert';toast('Termin storniert, die Zeit ist online wieder frei.')}
 else if(a==='slot'){const H=HRS[parse(C.date).getDay()],y=e.clientY-b.getBoundingClientRect().top;let t=H[0]*60+Math.floor(y/15)*15;t=Math.max(H[0]*60,Math.min(t,H[1]*60-15));NEWT={ma:+v,date:C.date,s:t,ls:13,err:''};NFOC=true}
 else if(a==='addt'){const H=HRS[parse(C.date).getDay()],m=MA[0].id,fr=slots(m,C.date,30+PUF);NEWT={ma:m,date:C.date,s:fr.length?fr[0]:H[0]*60,ls:13,err:''};NFOC=true}
 else if(a==='ncancel'){NEWT=null}
 else if(a==='nsave'){saveNew()}
 else if(a==='book'){const f=S.f,L=LS.find(x=>x.id===S.ls),blk=L.d+PUF;
  if(!f.vn||!f.nn||!/\S+@\S+\.\S+/.test(f.em||''))S.err='Bitte Vor- und Nachname sowie eine gültige E-Mail-Adresse eintragen.';
  else if(!f.ds)S.err='Bitte stimmen Sie der Speicherung Ihrer Angaben zu.';
  else{const ma=S.ma||(MA.find(m=>slots(m.id,S.date,blk).includes(S.t))||{}).id;
   if(!ma||!slots(ma,S.date,blk).includes(S.t)){S.err='Dieser Termin wurde gerade vergeben. Bitte eine andere Zeit wählen.';S.t=null}
   else{const ap={id:nid++,ma,ls:S.ls,date:S.date,s:S.t,e:S.t+blk,name:f.vn+' '+f.nn,tel:f.tl||'',mail:f.em,note:f.sw||'',st:'gebucht',neu:true};A.push(ap);S.done=ap;C.date=S.date;S.err='';sendMail(ap)}}}
 render()});
document.addEventListener('input',e=>{const n=e.target.name;if(n)S.f[n]=e.target.type==='checkbox'?e.target.checked:e.target.value});
document.addEventListener('pointerdown',e=>{const h=e.target.closest('.rz');if(!h)return;const el=h.closest('.ap'),ap=A.find(x=>x.id===+el.dataset.v);if(!ap)return;e.preventDefault();
 const H=HRS[parse(ap.date).getDay()],nx=A.filter(x=>x.id!==ap.id&&x.ma===ap.ma&&x.date===ap.date&&x.st!=='storniert'&&x.s>=ap.s).reduce((m,x)=>Math.min(m,x.s),Infinity);
 DR={ap,el,y:e.clientY,end:ap.e-PUF,ne:ap.e-PUF,want:ap.e-PUF,min:ap.s+15,max:Math.min(H[1]*60,nx-PUF),moved:false};el.classList.add('drag');try{h.setPointerCapture(e.pointerId)}catch(_){}});
document.addEventListener('pointermove',e=>{if(!DR)return;const dy=e.clientY-DR.y;if(Math.abs(dy)>3)DR.moved=true;if(!DR.moved)return;e.preventDefault();
 const w=DR.end+Math.round(dy/15)*15,ne=Math.max(DR.min,Math.min(DR.max,w));DR.want=w;if(ne!==DR.ne){DR.ne=ne;DR.el.style.height=(ne-DR.ap.s)+'px'}
 let t=DR.el.querySelector('.rzt');if(!t){t=document.createElement('span');t.className='rzt';DR.el.appendChild(t)}t.textContent='bis '+hm(DR.ne)+' Uhr · '+(DR.ne-DR.ap.s)+' Min.'});
const dragEnd=()=>{if(!DR)return;const {ap,ne,want,max,moved}=DR,M=MA.find(m=>m.id===ap.ma);DR.el.classList.remove('drag');DR=null;if(!moved)return;SUP=Date.now();
 if(want>max&&ne===max&&max<HRS[parse(ap.date).getDay()][1]*60)toast('Länger geht nicht: Danach hat '+M.t+' schon den nächsten Termin.');
 else if(want>max&&ne===max)toast('Länger geht nicht: Um '+hm(max)+' Uhr ist Ladenschluss.');
 if(ne!==ap.e-PUF){ap.e=ne+PUF;if(!(want>max&&ne===max))toast('Termin von '+ap.name+' geht jetzt bis '+hm(ne)+' Uhr ('+(ne-ap.s)+' Min.)')}
 render()};
document.addEventListener('pointerup',dragEnd);document.addEventListener('pointercancel',dragEnd);
document.addEventListener('keydown',e=>{if(!NEWT)return;if(e.key==='Escape'){NEWT=null;render()}else if(e.key==='Enter'&&e.target.closest&&e.target.closest('.mod')&&e.target.tagName==='INPUT'){e.preventDefault();saveNew();render()}});
addEventListener('hashchange',()=>{try{VIEW=location.hash||'#kunde'}catch(e){}DET=null;render();scrollTo(0,0)});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||!e.target.matches)return;if(e.target.matches('.ap,.lk'))e.target.click();else if(e.target.id==='pin')document.querySelector('[data-a=pin]').click()});
render();
</script>
</body>
</html>
